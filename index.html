<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="utf-8">
    <title>Simulator of Local Anesthetics</title>
    <link rel="icon" href="./assets/favicon.ico" id="favicon">
  </head>

  <body>
    <div id="version"></div>

    <div class="forPortrait">
      Please change screen to landscape (horizontal)<BR>
      <BR>
      画面を横向きにして下さい
    </div>

    <div class="forLandscape">
      <div id="left">
        <form name="lang" id="select-lang">
          <select name="la">
            <option value="en">English</option>
            <option value="ja">日本語</option>
            <option value="ko">한국어</option>
            <option value="zh-TW">中文（繁体）</option>
          </select>
        </form>

        <div id="buttons">
          <label><button id="newexp"></button></label>
          <label><button id="start"></button></label>
          <label><button id="save"></button></label>
          <label><button id="quit"></button></label>
        </div>

        <div id="timer"></div>
        <div id="response"></div>
      </div>

      <div id="right">
        <div>
          <input id="slider" type="range" min="1" max="10" value="1">
          <div id="speed_msg"></div>
        </div>
        <div id="image" class="image-wrapper" aria-disabled="false">
          <img id="image-normal" class="image" alt="">
          <img id="image-active" class="image image-hidden" alt="">
        </div>
      </div>
    </div>

    <script src="src/ts/main.ts" type="module"></script>
  </body>
